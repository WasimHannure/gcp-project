name: Deploy OpenClaw

on:
  push:
    branches: [ main ]

env:
  PROJECT_ID: bubbly-mantis-435212-k4
  REPOSITORY: openclaw
  IMAGE_NAME: openclaw
  REGISTRY: us-central1-docker.pkg.dev

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker authentication
      run: |
        gcloud auth configure-docker ${{ env.REGISTRY }}

    - name: Build Docker image
      run: |
        IMAGE_TAG="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
        IMAGE_TAG_LATEST="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest"
        echo "Building image: ${IMAGE_TAG}"
        docker build -t ${IMAGE_TAG} .
        docker tag ${IMAGE_TAG} ${IMAGE_TAG_LATEST}

    - name: Push image to Artifact Registry
      run: |
        IMAGE_TAG="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
        IMAGE_TAG_LATEST="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest"
        docker push ${IMAGE_TAG}
        docker push ${IMAGE_TAG_LATEST}

    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials ${{ secrets.GKE_CLUSTER_NAME }} \
          --region ${{ secrets.GCP_REGION }}

    - name: Create image pull secret
      run: |
        kubectl create secret docker-registry artifact-registry-secret \
          --docker-server=${{ env.REGISTRY }} \
          --docker-username=oauth2accesstoken \
          --docker-password="$(gcloud auth print-access-token)" \
          -n openclaw --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy with Helm
      run: |
        helm upgrade --install openclaw ./helm/openclaw \
          -n openclaw --create-namespace \
          --set image.repository=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }} \
          --set image.tag=${{ github.sha }} \
          --set gcpProject=${{ env.PROJECT_ID }}

    - name: Verify deployment
      run: |
        kubectl rollout status deployment/openclaw -n openclaw --timeout=5m
        kubectl get pods -n openclaw
        kubectl get svc -n openclaw
