apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-policy
spec:
  podSelector:
    matchLabels:
      app: openclaw
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - podSelector:
        matchLabels:
          app: openclaw
  - ports:
    - protocol: TCP
      port: 8080
